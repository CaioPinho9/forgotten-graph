<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Forgotten Realms Graph Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            crossorigin=""
    />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            width: 360px;
            max-width: calc(100vw - 24px);
            padding: 12px;
            border-radius: 10px;
            background: rgba(17, 24, 39, 0.94);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .panel h1 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .panel input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        .panel select {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: white;
            color: #111827;
        }

        .panel .buttons {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .panel button {
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .status, .info {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .info a {
            color: #93c5fd;
        }

        .info a:hover {
            color: #bfdbfe;
        }

        .leaflet-container {
            background: #111827;
        }

        .node-label {
            color: white;
            font-size: 11px;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
            pointer-events: none;
        }

        .legend {
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.9;
        }

        .menu-section {
            margin-top: 10px;
        }

        .menu-section-title {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="panel">
    <h1>Forgotten Realms Graph</h1>
    <div id="status" class="status">Loading manifest...</div>

    <input id="searchInput" type="text" placeholder="Search loaded node title..."/>

    <div class="buttons">
        <button id="searchBtn">Find</button>
        <button id="highlightClusterBtn">Highlight Cluster</button>
        <button id="resetBtn">Reset view</button>
        <button id="toggleEdgesBtn">Edges: On</button>
    </div>

    <div class="menu-section">
        <div class="menu-section-title">Highlight By Category</div>
        <select id="categoryMenu" size="6"></select>
        <div class="buttons">
            <button id="highlightCategoryMenuBtn">Highlight Category</button>
        </div>
    </div>

    <div class="menu-section">
        <div class="menu-section-title">Highlight By Cluster</div>
        <select id="clusterMenu" size="6"></select>
        <div class="buttons">
            <button id="highlightClusterMenuBtn">Highlight Cluster</button>
        </div>
    </div>

    <div class="legend">
        <span id="legendStaticZooms"></span><br/>
        <span id="legendInteractiveZooms"></span><br/>
        Highlighted neighborhood stays visible when zooming back out.
    </div>

    <div id="coords" class="info">Cursor: -, -</div>
    <div id="info" class="info">Waiting for data...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
    const TILE_SIZE = 1024;
    const NODE_RADIUS_SCALE = 1.0;
    const DRAG_REFRESH_MS = 60;
    const DRAG_TILE_PADDING = 2;
    const EDGE_BLEND_RADIUS = 1;
    const EDGE_BLEND_SIGMA = 0.85;

    const NODE_TILES_BASE = "./data/tiles_nodes";
    const EDGE_TILES_BASE = "./data/tiles_edges";
    const CHUNKS_BASE = "./data/graph_chunks";
    const ADJACENCY_API = "/api/adjacency";

    const statusEl = document.getElementById("status");
    const coordsEl = document.getElementById("coords");
    const infoEl = document.getElementById("info");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const highlightClusterBtn = document.getElementById("highlightClusterBtn");
    const categoryMenu = document.getElementById("categoryMenu");
    const clusterMenu = document.getElementById("clusterMenu");
    const highlightCategoryMenuBtn = document.getElementById("highlightCategoryMenuBtn");
    const highlightClusterMenuBtn = document.getElementById("highlightClusterMenuBtn");
    const resetBtn = document.getElementById("resetBtn");
    const toggleEdgesBtn = document.getElementById("toggleEdgesBtn");
    const legendStaticZoomsEl = document.getElementById("legendStaticZooms");
    const legendInteractiveZoomsEl = document.getElementById("legendInteractiveZooms");

    let manifest = null;
    let zoomConfig = null;
    let edgesEnabled = true;
    let nodeTiles = null;
    let edgeTiles = null;
    let boundsInfo = null;
    let map = null;
    let nodeRenderer = null;

    let preservedHighlightGraph = null; // { nodes: Map<string, object>, edges: Array<{source,target}> }
    let highlightedNodeId = null;
    let highlightedNeighborIds = new Set();
    let highlightedClusterId = null;
    let searchIndex = [];

    const loadedNodeTiles = new Set();
    const loadedNodeTileNodeIds = new Map();
    const nodeTileRequests = new Map();

    const edgeLayer = L.layerGroup();
    const highlightEdgeLayer = L.layerGroup();
    const nodeLayer = L.layerGroup();
    const highlightNodeLayer = L.layerGroup();
    const labelLayer = L.layerGroup();
    const highlightLabelLayer = L.layerGroup();

    const nodeIndex = new Map(); // visible interactive nodes only
    const labelIndex = new Map(); // visible interactive labels only
    const highlightNodeIndex = new Map();
    const highlightLabelIndex = new Map();
    const highlightEdgeKeys = new Set();

    let viewUpdateToken = 0;
    let viewUpdateFrame = null;
    let dragRefreshTimer = null;
    let currentInteractiveZoom = null;
    let currentInteractiveTileKeys = new Set();
    let isMapDragging = false;

    function getStaticTileMaxZoom() {
        return zoomConfig?.static_tile_max_zoom ?? manifest?.zoom_config?.static_tile_max_zoom ?? 5;
    }

    function getInteractiveMinZoom() {
        return zoomConfig?.interactive_min_zoom ?? manifest?.zoom_config?.interactive_min_zoom ?? 6;
    }

    function getEdgeTileMaxZoom() {
        return zoomConfig?.edge_tile_max_zoom ?? manifest?.zoom_config?.edge_tile_max_zoom ?? 7;
    }

    function nearestAvailableZoom(targetZoom, availableZooms) {
        if (!Array.isArray(availableZooms) || availableZooms.length === 0) return targetZoom;

        let bestZoom = availableZooms[0];
        let bestDistance = Math.abs(bestZoom - targetZoom);
        for (let i = 1; i < availableZooms.length; i += 1) {
            const candidate = availableZooms[i];
            const distance = Math.abs(candidate - targetZoom);
            if (distance < bestDistance) {
                bestZoom = candidate;
                bestDistance = distance;
            }
        }
        return bestZoom;
    }

    function createEdgeTileLayer(leafletBounds) {
        const group = L.layerGroup();
        group._leafletBounds = leafletBounds;
        group._zoomLayers = new Map();
        group._activeZooms = new Set();
        return group;
    }

    function createFixedEdgeTileLayer(leafletBounds, fixedZoom) {
        const layer = L.tileLayer(`${EDGE_TILES_BASE}/${fixedZoom}/{x}/{y}.png`, {
            tileSize: TILE_SIZE,
            minZoom: 0,
            minNativeZoom: fixedZoom,
            maxNativeZoom: fixedZoom,
            maxZoom: 10,
            updateWhenIdle: false,
            updateWhenZooming: true,
            updateInterval: 16,
            keepBuffer: 4,
            noWrap: true,
            bounds: leafletBounds,
            opacity: 1.0,
        });
        layer._isReady = false;
        layer.on("load", () => {
            layer._isReady = true;
            scheduleViewUpdate();
        });
        return layer;
    }

    function syncEdgeTileBlend() {
        if (!map || !edgeTiles) return;

        const maxEdgeZoom = Math.max(0, getEdgeTileMaxZoom());
        const rawZoom = map.getZoom();
        const clampedZoom = Math.max(0, Math.min(maxEdgeZoom, rawZoom));
        const floorZoom = Math.floor(clampedZoom);
        const bounds = edgeTiles._leafletBounds;
        const neededZooms = new Set();

        for (let z = floorZoom - EDGE_BLEND_RADIUS; z <= floorZoom + EDGE_BLEND_RADIUS + 1; z += 1) {
            if (z < 0 || z > maxEdgeZoom) continue;
            neededZooms.add(z);
        }

        for (const [z, layer] of Array.from(edgeTiles._zoomLayers.entries())) {
            if (neededZooms.has(z)) continue;
            if (!edgeTiles._activeZooms.has(z)) {
                edgeTiles.removeLayer(layer);
                edgeTiles._zoomLayers.delete(z);
            }
        }

        const weights = new Map();
        let weightSum = 0;
        for (const z of neededZooms) {
            const distance = Math.abs(z - clampedZoom);
            const w = Math.exp(-(distance * distance) / (2 * EDGE_BLEND_SIGMA * EDGE_BLEND_SIGMA));
            weights.set(z, w);
            weightSum += w;
        }

        for (const z of neededZooms) {
            let layer = edgeTiles._zoomLayers.get(z);
            if (!layer) {
                layer = createFixedEdgeTileLayer(bounds, z);
                edgeTiles._zoomLayers.set(z, layer);
                edgeTiles.addLayer(layer);
                layer.setOpacity(0);
            }
        }

        const activeZooms = Array.from(edgeTiles._activeZooms);
        const hasActiveBlend = activeZooms.length > 0;
        const allNeededReady = Array.from(neededZooms).every(z => edgeTiles._zoomLayers.get(z)?._isReady === true);

        if (hasActiveBlend && !allNeededReady) {
            return;
        }

        for (const [z, layer] of Array.from(edgeTiles._zoomLayers.entries())) {
            if (neededZooms.has(z)) {
                layer.setOpacity(weightSum > 0 ? weights.get(z) / weightSum : 0);
            } else {
                layer.setOpacity(0);
                edgeTiles.removeLayer(layer);
                edgeTiles._zoomLayers.delete(z);
            }
        }

        edgeTiles._activeZooms = new Set(neededZooms);
    }

    function getLabelMinZoom() {
        return zoomConfig?.label_min_zoom ?? manifest?.zoom_config?.label_min_zoom ?? manifest?.label_min_zoom ?? 7;
    }

    function nodeRadiusForZoom(nodeSize, zoomLevel) {
        const z = Number.isFinite(zoomLevel) ? zoomLevel : getInteractiveMinZoom();
        const zoomScale = Math.max(0.75, 0.55 + z * 0.11);
        return Math.max(2.0, (nodeSize || 1.5) * NODE_RADIUS_SCALE * zoomScale);
    }

    function scheduleViewUpdate() {
        if (viewUpdateFrame !== null) return;

        viewUpdateFrame = requestAnimationFrame(() => {
            viewUpdateFrame = null;
            syncEdgeTileBlend();
            updateStaticTileVisibility();
            refreshNodeStylesForZoom();
            updateVisibleData().catch(err => {
                console.error(err);
                setStatus(`Error updating view: ${err.message}`);
            });
        });
    }

    function startDragRefreshLoop() {
        if (dragRefreshTimer !== null) return;
        dragRefreshTimer = setInterval(() => {
            scheduleViewUpdate();
        }, DRAG_REFRESH_MS);
    }

    function stopDragRefreshLoop() {
        if (dragRefreshTimer === null) return;
        clearInterval(dragRefreshTimer);
        dragRefreshTimer = null;
    }

    function setStatus(text) {
        statusEl.textContent = text;
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function setInfo(text) {
        infoEl.textContent = text;
    }

    function setInfoHtml(html) {
        infoEl.innerHTML = html;
    }

    function setCoords(text) {
        coordsEl.textContent = text;
    }

    function formatClusterText(clusterName, clusterId) {
        return clusterName ? `${clusterName} (#${clusterId})` : `#${clusterId}`;
    }

    function updateLegendText() {
        const staticMaxZoom = getStaticTileMaxZoom();
        const interactiveMinZoom = getInteractiveMinZoom();

        legendStaticZoomsEl.textContent =
            `Zoom 0-${staticMaxZoom}: static node tiles + static edge tiles.`;
        legendInteractiveZoomsEl.textContent =
            `Zoom ${interactiveMinZoom}+: interactive node chunks load.`;
    }

    async function fetchJson(path) {
        const r = await fetch(path);
        if (!r.ok) throw new Error(`Failed to fetch ${path}`);
        return r.json();
    }

    function hexToRgb(hex) {
        const clean = (hex || "").replace("#", "");
        if (clean.length !== 6) return {r: 120, g: 120, b: 120};
        return {
            r: parseInt(clean.slice(0, 2), 16),
            g: parseInt(clean.slice(2, 4), 16),
            b: parseInt(clean.slice(4, 6), 16),
        };
    }

    function clamp(value, minValue, maxValue) {
        return Math.max(minValue, Math.min(maxValue, value));
    }

    function edgeOpacityForNodeSizes(sourceSize, targetSize, highlighted = false) {
        if (highlighted) return 0.55;

        const maxSize = Math.max(Number(sourceSize) || 0, Number(targetSize) || 0, 0);
        const opacity = 0.34 + Math.log1p(maxSize) * 0.12;
        return clamp(opacity, 0.34, 0.9);
    }

    function edgeGradientStyle(sourceColor, targetColor, sourceSize, targetSize, highlighted = false) {
        const a = hexToRgb(sourceColor);
        const b = hexToRgb(targetColor);
        const mid = {
            r: Math.round((a.r + b.r) / 2),
            g: Math.round((a.g + b.g) / 2),
            b: Math.round((a.b + b.b) / 2),
        };
        return {
            color: `rgb(${mid.r}, ${mid.g}, ${mid.b})`,
            weight: highlighted ? 1 : 1,
            opacity: edgeOpacityForNodeSizes(sourceSize, targetSize, highlighted),
        };
    }

    function buildWorldCRS(bounds) {
        const minX = bounds.min_x;
        const maxX = bounds.max_x;
        const minY = bounds.min_y;
        const maxY = bounds.max_y;
        const worldW = Math.max(maxX - minX, 1e-9);
        const worldH = Math.max(maxY - minY, 1e-9);

        const projection = {
            project(latlng) {
                const px = ((latlng.lng - minX) / worldW) * TILE_SIZE;
                const py = (1.0 - (latlng.lat - minY) / worldH) * TILE_SIZE;
                return L.point(px, py);
            },
            unproject(pt) {
                const worldX = (pt.x / TILE_SIZE) * worldW + minX;
                const worldY = (1.0 - pt.y / TILE_SIZE) * worldH + minY;
                return L.latLng(worldY, worldX);
            },
            bounds: L.bounds(L.point(0, 0), L.point(TILE_SIZE, TILE_SIZE)),
        };

        return L.extend({}, L.CRS, {
            code: "CRS:World",
            projection,
            transformation: new L.Transformation(1, 0, 1, 0),
            scale(zoom) {
                return Math.pow(2, zoom);
            },
            zoom(scale) {
                return Math.log(scale) / Math.LN2;
            },
            infinite: false,
            wrapLng: null,
            wrapLat: null,
        });
    }

    function wll(worldX, worldY) {
        return L.latLng(worldY, worldX);
    }

    function worldBoundsToLeaflet(b) {
        return L.latLngBounds(wll(b.min_x, b.min_y), wll(b.max_x, b.max_y));
    }

    function resetMapView(m, b) {
        const lb = worldBoundsToLeaflet(b);
        const zoom = m.getBoundsZoom(lb, false, L.point(20, 20));
        m.setView(wll((b.min_x + b.max_x) / 2, (b.min_y + b.max_y) / 2), zoom, {animate: false});
    }

    function buildMap(bounds) {
        const crs = buildWorldCRS(bounds);
        const leafletBounds = worldBoundsToLeaflet(bounds);

        const builtMap = L.map("map", {
            crs,
            minZoom: 0,
            maxZoom: 10,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            attributionControl: false,
            scrollWheelZoom: true,
            wheelPxPerZoomLevel: 180,
        });
        nodeRenderer = L.canvas({padding: 0.5});

        resetMapView(builtMap, bounds);
        builtMap.setMaxBounds(leafletBounds.pad(0.1));

        edgeTiles = createEdgeTileLayer(leafletBounds);
        syncEdgeTileBlend();

        nodeTiles = L.tileLayer(`${NODE_TILES_BASE}/{z}/{x}/{y}.png`, {
            tileSize: TILE_SIZE,
            minZoom: 0,
            maxNativeZoom: getStaticTileMaxZoom(),
            maxZoom: getInteractiveMinZoom(),
            updateWhenIdle: false,
            updateWhenZooming: true,
            updateInterval: 16,
            keepBuffer: 4,
            noWrap: true,
            bounds: leafletBounds,
            opacity: 1.0,
        });

        if (edgesEnabled) edgeTiles.addTo(builtMap);
        edgeLayer.addTo(builtMap);
        highlightEdgeLayer.addTo(builtMap);
        nodeTiles.addTo(builtMap);
        nodeLayer.addTo(builtMap);
        highlightNodeLayer.addTo(builtMap);
        labelLayer.addTo(builtMap);
        highlightLabelLayer.addTo(builtMap);

        updateStaticTileVisibility();

        builtMap.on("move", scheduleViewUpdate);
        builtMap.on("zoom", scheduleViewUpdate);
        builtMap.on("moveend", scheduleViewUpdate);
        builtMap.on("zoomend", scheduleViewUpdate);
        builtMap.on("dragstart", () => {
            isMapDragging = true;
            startDragRefreshLoop();
        });
        builtMap.on("dragend", () => {
            stopDragRefreshLoop();
            requestAnimationFrame(() => {
                isMapDragging = false;
                scheduleViewUpdate();
            });
        });
        builtMap.on("click", e => {
            if (isMapDragging) return;

            const target = e.originalEvent?.target;
            if (target?.closest?.(".leaflet-interactive")) return;
            if (target?.closest?.(".panel")) return;
            if (!preservedHighlightGraph) return;

            clearHighlightVisuals();
            scheduleViewUpdate();
        });

        builtMap.on("mousemove", e => {
            setCoords(`Cursor: x=${e.latlng.lng.toFixed(2)} y=${e.latlng.lat.toFixed(2)}`);
        });

        builtMap.on("mouseout", () => {
            setCoords("Cursor: -, -");
        });

        return builtMap;
    }

    function updateStaticTileVisibility() {
        if (!map) return;

        const zoom = map.getZoom();

        if (zoom < getInteractiveMinZoom()) {
            if (!map.hasLayer(nodeTiles)) nodeTiles.addTo(map);
        } else if (map.hasLayer(nodeTiles)) {
            map.removeLayer(nodeTiles);
        }

        if (edgesEnabled) {
            syncEdgeTileBlend();
            if (!map.hasLayer(edgeTiles)) edgeTiles.addTo(map);
        } else if (map.hasLayer(edgeTiles)) {
            map.removeLayer(edgeTiles);
        }
    }

    function tileKey(zoom, tx, ty) {
        return `${zoom}:${tx}:${ty}`;
    }

    function getVisibleTiles(currentMap, zoom, padding = 0) {
        const zInfo = manifest.zoom_levels[String(zoom)];
        if (!zInfo) return [];

        const tilesPerAxis = zInfo.tiles_per_axis;
        const b = currentMap.getBounds();
        const bd = boundsInfo;

        const worldW = Math.max(bd.max_x - bd.min_x, 1e-9);
        const worldH = Math.max(bd.max_y - bd.min_y, 1e-9);

        function toTX(worldX) {
            const nx = (worldX - bd.min_x) / worldW;
            return Math.max(0, Math.min(tilesPerAxis - 1, Math.floor(nx * tilesPerAxis)));
        }

        function toTY(worldY) {
            const ny = 1.0 - (worldY - bd.min_y) / worldH;
            return Math.max(0, Math.min(tilesPerAxis - 1, Math.floor(ny * tilesPerAxis)));
        }

        const rawTxMin = toTX(b.getWest());
        const rawTxMax = toTX(b.getEast());
        const rawTyMin = toTY(b.getNorth());
        const rawTyMax = toTY(b.getSouth());
        const txMin = Math.max(0, rawTxMin - padding);
        const txMax = Math.min(tilesPerAxis - 1, rawTxMax + padding);
        const tyMin = Math.max(0, rawTyMin - padding);
        const tyMax = Math.min(tilesPerAxis - 1, rawTyMax + padding);

        const tiles = [];
        for (let tx = txMin; tx <= txMax; tx++) {
            for (let ty = tyMin; ty <= tyMax; ty++) {
                tiles.push({tx, ty});
            }
        }
        return tiles;
    }

    function getNodeEntry(nodeId) {
        return highlightNodeIndex.get(nodeId) ?? nodeIndex.get(nodeId) ?? null;
    }

    function getAllNodeEntries() {
        const merged = new Map(nodeIndex);
        for (const [id, entry] of highlightNodeIndex.entries()) {
            merged.set(id, entry);
        }
        return merged;
    }

    function makeNodeStyle(node, role = "default") {
        const radius = nodeRadiusForZoom(node.size, map?.getZoom?.());
        if (role === "highlighted") {
            return {
                radius,
                color: "#ffffff",
                fillColor: node.color,
                fillOpacity: 1.0,
                opacity: 1.0,
                weight: 2,
            };
        }

        if (role === "neighbor") {
            return {
                radius,
                color: "#ffffff",
                fillColor: node.color,
                fillOpacity: 0.9,
                opacity: 1.0,
                weight: 1.5,
            };
        }

        return {
            radius,
            color: node.color,
            fillColor: node.color,
            fillOpacity: 0.8,
            opacity: 1.0,
            weight: 1,
        };
    }

    function refreshNodeStylesForZoom() {
        for (const [, entry] of nodeIndex.entries()) {
            entry.layer.setStyle(makeNodeStyle(entry.data, "default"));
        }
        for (const [id, entry] of highlightNodeIndex.entries()) {
            const role = id === highlightedNodeId ? "highlighted" : "neighbor";
            entry.layer.setStyle(makeNodeStyle(entry.data, role));
        }
    }

    function registerNodeLayer(index, layerGroup, node, role = "default") {
        const latlng = wll(node.x, node.y);
        const style = makeNodeStyle(node, role);
        const circle = L.circleMarker(latlng, {
            ...style,
            renderer: nodeRenderer || undefined,
        });

        circle.on("click", async () => {
            const token = ++viewUpdateToken;
            await ensureHighlightedNeighborhood(node.id, token);
            if (token !== viewUpdateToken) return;
            renderHighlightOverlay();
        });

        index.set(node.id, {latlng, data: node, layer: circle});
        layerGroup.addLayer(circle);
        return circle;
    }

    function addVisibleNode(node) {
        if (nodeIndex.has(node.id)) return;
        registerNodeLayer(nodeIndex, nodeLayer, node, "default");
    }

    function addHighlightNode(node) {
        if (highlightNodeIndex.has(node.id)) return;
        const role = node.id === highlightedNodeId ? "highlighted" : "neighbor";
        registerNodeLayer(highlightNodeIndex, highlightNodeLayer, node, role);
    }

    function addLabelToLayer(index, layerGroup, node) {
        if (!node.label || index.has(node.id)) return;

        const marker = L.marker(wll(node.x, node.y), {
            interactive: false,
            icon: L.divIcon({
                className: "node-label",
                html: node.label,
                iconSize: [0, 0],
            }),
        });

        index.set(node.id, marker);
        layerGroup.addLayer(marker);
    }

    function clearVisibleLabels() {
        labelLayer.clearLayers();
        labelIndex.clear();
    }

    function clearHighlightLabels() {
        highlightLabelLayer.clearLayers();
        highlightLabelIndex.clear();
    }

    function clearVisibleInteractiveData() {
        nodeLayer.clearLayers();
        edgeLayer.clearLayers();
        clearVisibleLabels();
        nodeIndex.clear();
        loadedNodeTiles.clear();
        loadedNodeTileNodeIds.clear();
        currentInteractiveZoom = null;
        currentInteractiveTileKeys = new Set();
    }

    function clearHighlightOverlay() {
        highlightEdgeLayer.clearLayers();
        highlightNodeLayer.clearLayers();
        clearHighlightLabels();
        highlightNodeIndex.clear();
        highlightEdgeKeys.clear();
    }

    function clearHighlightVisuals() {
        highlightedNodeId = null;
        highlightedNeighborIds = new Set();
        highlightedClusterId = null;
        preservedHighlightGraph = null;
        clearHighlightOverlay();
    }

    function removeVisibleNodeById(nodeId) {
        const entry = nodeIndex.get(nodeId);
        if (!entry) return;

        nodeLayer.removeLayer(entry.layer);
        nodeIndex.delete(nodeId);

        const label = labelIndex.get(nodeId);
        if (label) {
            labelLayer.removeLayer(label);
            labelIndex.delete(nodeId);
        }
    }

    function pruneHiddenTiles(desiredTileKeys) {
        for (const key of Array.from(loadedNodeTiles)) {
            if (desiredTileKeys.has(key)) continue;

            const nodeIds = loadedNodeTileNodeIds.get(key) || new Set();
            for (const nodeId of nodeIds) {
                removeVisibleNodeById(nodeId);
            }

            loadedNodeTiles.delete(key);
            loadedNodeTileNodeIds.delete(key);
        }
    }

    function setHighlightInfo(nodeId) {
        const entry = getNodeEntry(nodeId);
        if (!entry) return;

        const d = entry.data;
        const pageUrl = pageUrlFromTitle(d.id);
        const clusterText = d.cluster_name ? `${d.cluster_name} (#${d.cluster_id})` : d.cluster_id;
        const categoriesText = d.categories?.length ? d.categories.join(", ") : "None";
        setInfoHtml(
            `Node: ${escapeHtml(d.id)}<br>` +
            `URL: <a href="${pageUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(pageUrl)}</a><br>` +
            `Cluster: ${escapeHtml(clusterText)}<br>` +
            `Categories: ${escapeHtml(categoriesText)}<br>` +
            `In-degree: ${escapeHtml(d.in_degree)}<br>` +
            `Out-degree: ${escapeHtml(d.out_degree)}`
        );
    }

    function setClusterInfo(nodeId, clusterName, clusterId, count) {
        const entry = getNodeEntry(nodeId);
        if (!entry) return;
        const pageUrl = pageUrlFromTitle(entry.data.id);
        const clusterText = formatClusterText(clusterName, clusterId);

        setInfoHtml(
            `Node: ${escapeHtml(entry.data.id)}<br>` +
            `URL: <a href="${pageUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(pageUrl)}</a><br>` +
            `Cluster highlight: ${escapeHtml(clusterText)}<br>` +
            `Matching nodes: ${escapeHtml(count)}`
        );
    }

    function setCategoryMenuInfo(categoryName, count) {
        setInfoHtml(
            `Category highlight: ${escapeHtml(categoryName)}<br>` +
            `Matching nodes: ${escapeHtml(count)}`
        );
    }

    function setClusterMenuInfo(clusterName, clusterId, count) {
        setInfoHtml(
            `Cluster highlight: ${escapeHtml(formatClusterText(clusterName, clusterId))}<br>` +
            `Matching nodes: ${escapeHtml(count)}`
        );
    }

    function clearExistingHighlight(keepSelectedNode = true) {
        clearHighlightOverlay();
        highlightedNeighborIds = new Set();
        preservedHighlightGraph = null;
        highlightedClusterId = null;
        if (!keepSelectedNode) {
            highlightedNodeId = null;
        }
    }

    function applyNodeSetHighlight(graphNodes, focusNodeId = null) {
        clearExistingHighlight(focusNodeId !== null);

        const neighborIds = new Set();
        for (const nodeId of graphNodes.keys()) {
            if (nodeId !== focusNodeId) {
                neighborIds.add(nodeId);
            }
        }

        highlightedNodeId = focusNodeId;
        highlightedNeighborIds = neighborIds;
        preservedHighlightGraph = {
            nodes: graphNodes,
            edges: [],
        };
        renderHighlightOverlay();
    }

    function pageUrlFromTitle(title) {
        return `https://forgottenrealms.fandom.com/wiki/${encodeURIComponent(title.replace(/ /g, "_"))}`;
    }

    function dedupeEdges(edges) {
        const seen = new Set();
        const deduped = [];

        for (const edge of edges) {
            const key = `${edge.source}→${edge.target}`;
            if (seen.has(key)) continue;
            seen.add(key);
            deduped.push(edge);
        }

        return deduped;
    }

    function buildHighlightGraph(nodeId, payload) {
        const sourceEntry = getNodeEntry(nodeId);
        if (!sourceEntry) return null;

        const graphNodes = new Map();
        const graphEdges = [];
        const neighborIds = new Set();

        graphNodes.set(nodeId, sourceEntry.data);

        for (const node of payload.neighbor_nodes || []) {
            graphNodes.set(node.id, node);
        }
        for (const node of payload.out_nodes || []) {
            graphNodes.set(node.id, node);
        }
        for (const node of payload.in_nodes || []) {
            graphNodes.set(node.id, node);
        }

        for (const neighborId of payload.out || []) {
            neighborIds.add(neighborId);
            if (!graphNodes.has(neighborId)) {
                const existing = getNodeEntry(neighborId);
                if (existing) graphNodes.set(neighborId, existing.data);
            }
            graphEdges.push({source: nodeId, target: neighborId});
        }

        for (const neighborId of payload.in || []) {
            neighborIds.add(neighborId);
            if (!graphNodes.has(neighborId)) {
                const existing = getNodeEntry(neighborId);
                if (existing) graphNodes.set(neighborId, existing.data);
            }
            graphEdges.push({source: neighborId, target: nodeId});
        }

        if (graphEdges.length === 0) {
            for (const neighborId of payload.neighbors || []) {
                neighborIds.add(neighborId);
                if (!graphNodes.has(neighborId)) {
                    const existing = getNodeEntry(neighborId);
                    if (existing) graphNodes.set(neighborId, existing.data);
                }
                graphEdges.push({source: nodeId, target: neighborId});
            }
        }

        return {
            nodes: graphNodes,
            edges: dedupeEdges(graphEdges),
            neighborIds,
        };
    }

    async function ensureHighlightedNeighborhood(nodeId, token) {
        if (token !== viewUpdateToken) return;

        const payload = await fetchJson(`${ADJACENCY_API}?node_id=${encodeURIComponent(nodeId)}`).catch(() => null);
        if (token !== viewUpdateToken) return;
        if (!payload) return;

        const graph = buildHighlightGraph(nodeId, payload);
        if (!graph) return;

        highlightedNodeId = nodeId;
        highlightedNeighborIds = graph.neighborIds;
        highlightedClusterId = null;
        preservedHighlightGraph = {
            nodes: graph.nodes,
            edges: graph.edges,
        };
        setHighlightInfo(nodeId);
    }

    function highlightClusterForCurrentNode() {
        if (!highlightedNodeId) {
            setInfo("Select or find a node first.");
            return;
        }

        const entry = getNodeEntry(highlightedNodeId);
        if (!entry) {
            setInfo("Selected node is not available.");
            return;
        }

        const clusterId = entry.data.cluster_id;
        if (clusterId === null || clusterId === undefined) {
            setInfo(`Node has no cluster: ${entry.data.id}`);
            return;
        }

        const clusterName = entry.data.cluster_name || null;

        const graphNodes = new Map();

        for (const node of searchIndex) {
            if (node.cluster_id !== clusterId) continue;
            graphNodes.set(node.id, node);
        }

        graphNodes.set(highlightedNodeId, entry.data);
        highlightedClusterId = clusterId;
        applyNodeSetHighlight(graphNodes, highlightedNodeId);
        setClusterInfo(highlightedNodeId, clusterName, clusterId, graphNodes.size);
    }

    function highlightCategoryByMenu() {
        const categoryName = categoryMenu.value;
        if (!categoryName) {
            setInfo("Select a category first.");
            return;
        }

        const graphNodes = new Map();
        for (const node of searchIndex) {
            if ((node.categories || []).includes(categoryName)) {
                graphNodes.set(node.id, node);
            }
        }

        if (graphNodes.size === 0) {
            setInfo(`No nodes found for category: ${categoryName}`);
            return;
        }

        applyNodeSetHighlight(graphNodes, null);
        setCategoryMenuInfo(categoryName, graphNodes.size);
    }

    function highlightClusterByMenu() {
        const rawClusterId = clusterMenu.value;
        if (!rawClusterId) {
            setInfo("Select a cluster first.");
            return;
        }

        const clusterId = Number(rawClusterId);
        const graphNodes = new Map();
        let clusterName = null;

        for (const node of searchIndex) {
            if (node.cluster_id !== clusterId) continue;
            graphNodes.set(node.id, node);
            clusterName = clusterName || node.cluster_name || null;
        }

        if (graphNodes.size === 0) {
            setInfo(`No nodes found for cluster: ${rawClusterId}`);
            return;
        }

        highlightedClusterId = clusterId;
        applyNodeSetHighlight(graphNodes, null);
        setClusterMenuInfo(clusterName, clusterId, graphNodes.size);
    }

    function populateHighlightMenus() {
        const categoryCounts = new Map();
        const clusterCounts = new Map();

        for (const node of searchIndex) {
            for (const category of node.categories || []) {
                categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1);
            }

            const clusterId = node.cluster_id;
            if (clusterId === null || clusterId === undefined) continue;
            const existing = clusterCounts.get(clusterId) || {
                name: node.cluster_name || null,
                count: 0,
            };
            existing.name = existing.name || node.cluster_name || null;
            existing.count += 1;
            clusterCounts.set(clusterId, existing);
        }

        categoryMenu.innerHTML = "";
        clusterMenu.innerHTML = "";

        for (const [categoryName, count] of Array.from(categoryCounts.entries()).sort((a, b) => a[0].localeCompare(b[0]))) {
            const option = document.createElement("option");
            option.value = categoryName;
            option.textContent = `${categoryName} (${count})`;
            categoryMenu.appendChild(option);
        }

        for (const [clusterId, meta] of Array.from(clusterCounts.entries()).sort((a, b) => {
            const left = formatClusterText(a[1].name, a[0]);
            const right = formatClusterText(b[1].name, b[0]);
            return left.localeCompare(right);
        })) {
            const option = document.createElement("option");
            option.value = String(clusterId);
            option.textContent = `${formatClusterText(meta.name, clusterId)} (${meta.count})`;
            clusterMenu.appendChild(option);
        }
    }

    function getEdgeEndpointPoints(fromLatLng, toLatLng, sourceRadiusPx = 0, targetRadiusPx = 0) {
        const p1 = map.latLngToLayerPoint(fromLatLng);
        const p2 = map.latLngToLayerPoint(toLatLng);

        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 0.0001) return null;

        const ux = dx / len;
        const uy = dy / len;

        return {
            start: L.point(p1.x + ux * sourceRadiusPx, p1.y + uy * sourceRadiusPx),
            end: L.point(p2.x - ux * targetRadiusPx, p2.y - uy * targetRadiusPx),
            ux,
            uy,
        };
    }

    function makeArrowHeadPoints(fromLatLng, toLatLng, sourceRadiusPx = 0, targetRadiusPx = 0, sizePx = 10, spreadPx = 6) {
        const endpoints = getEdgeEndpointPoints(fromLatLng, toLatLng, sourceRadiusPx, targetRadiusPx);
        if (!endpoints) return null;

        const {end: tip, ux, uy} = endpoints;
        const baseX = tip.x - ux * sizePx;
        const baseY = tip.y - uy * sizePx;

        const px = -uy;
        const py = ux;

        const left = L.point(baseX + px * spreadPx, baseY + py * spreadPx);
        const right = L.point(baseX - px * spreadPx, baseY - py * spreadPx);

        return [
            map.layerPointToLatLng(tip),
            map.layerPointToLatLng(left),
            map.layerPointToLatLng(right),
        ];
    }

    function addArrowedEdgeToLayer(layerGroup, keySet, sourceEntry, targetEntry, highlighted = false) {
        if (!sourceEntry || !targetEntry) return;

        const sourceId = sourceEntry.data.id;
        const targetId = targetEntry.data.id;
        const key = `${sourceId}→${targetId}`;
        if (keySet.has(key)) return;
        keySet.add(key);

        const style = edgeGradientStyle(
            sourceEntry.data.color,
            targetEntry.data.color,
            sourceEntry.data.size,
            targetEntry.data.size,
            highlighted
        );

        const sourceRadiusPx = sourceEntry.layer.getRadius ? sourceEntry.layer.getRadius() : Math.max(1.5, sourceEntry.data.size * NODE_RADIUS_SCALE);
        const targetRadiusPx = targetEntry.layer.getRadius ? targetEntry.layer.getRadius() : Math.max(1.5, targetEntry.data.size * NODE_RADIUS_SCALE);
        const endpoints = getEdgeEndpointPoints(sourceEntry.latlng, targetEntry.latlng, sourceRadiusPx, targetRadiusPx);
        if (!endpoints) return;

        const line = L.polyline([
            map.layerPointToLatLng(endpoints.start),
            map.layerPointToLatLng(endpoints.end),
        ], style);
        line._sourceId = sourceId;
        line._targetId = targetId;
        line._baseStyle = style;

        const arrowPoints = makeArrowHeadPoints(
            sourceEntry.latlng,
            targetEntry.latlng,
            sourceRadiusPx,
            targetRadiusPx,
            highlighted ? 12 : 9,
            highlighted ? 7 : 5
        );

        let arrow = null;
        if (arrowPoints) {
            arrow = L.polygon(arrowPoints, {
                color: style.color,
                fillColor: style.color,
                fillOpacity: highlighted ? Math.min(style.opacity, 0.45) : style.opacity,
                opacity: style.opacity,
                weight: 1,
                interactive: false,
            });
            arrow._sourceId = sourceId;
            arrow._targetId = targetId;
        }

        const group = L.layerGroup();
        group.addLayer(line);
        if (arrow) group.addLayer(arrow);

        group._line = line;
        group._arrow = arrow;
        group._sourceId = sourceId;
        group._targetId = targetId;
        group._baseStyle = style;

        layerGroup.addLayer(group);
    }

    function renderHighlightOverlay() {
        clearHighlightOverlay();
        if (!preservedHighlightGraph) return;

        for (const [, node] of preservedHighlightGraph.nodes.entries()) {
            addHighlightNode(node);
        }

        for (const edge of preservedHighlightGraph.edges) {
            const sourceEntry = highlightNodeIndex.get(edge.source);
            const targetEntry = highlightNodeIndex.get(edge.target);
            addArrowedEdgeToLayer(highlightEdgeLayer, highlightEdgeKeys, sourceEntry, targetEntry, true);
        }

        if (map.getZoom() >= getLabelMinZoom()) {
            for (const [, entry] of highlightNodeIndex.entries()) {
                entry.data.label = entry.data.label ?? entry.data.id;
                addLabelToLayer(highlightLabelIndex, highlightLabelLayer, entry.data);
            }
        }
    }

    async function loadNodeTile(zoom, tx, ty) {
        const key = tileKey(zoom, tx, ty);
        if (loadedNodeTiles.has(key)) return;

        let req = nodeTileRequests.get(key);
        if (!req) {
            req = fetchJson(`${CHUNKS_BASE}/z${zoom}/nodes_${tx}_${ty}.json`)
                .catch(() => null)
                .finally(() => nodeTileRequests.delete(key));
            nodeTileRequests.set(key, req);
        }

        const nodes = await req;
        if (!nodes) return;

        if (zoom !== currentInteractiveZoom) return;
        // While dragging, accept tiles from the current zoom even if viewport already shifted.
        // They will be pruned when dragging ends and desired tiles are recalculated.
        if (!isMapDragging && !currentInteractiveTileKeys.has(key)) return;
        if (loadedNodeTiles.has(key)) return;

        loadedNodeTiles.add(key);
        loadedNodeTileNodeIds.set(key, new Set(nodes.map(node => node.id)));

        for (const node of nodes) {
            addVisibleNode(node);
            if (map.getZoom() >= getLabelMinZoom()) {
                addLabelToLayer(labelIndex, labelLayer, node);
            }
        }

        if (preservedHighlightGraph) {
            renderHighlightOverlay();
        }
    }

    async function updateVisibleData() {
        const rawZoom = map.getZoom();
        const isInteractive = rawZoom >= getInteractiveMinZoom();

        if (!isInteractive) {
            clearVisibleInteractiveData();
            renderHighlightOverlay();

            if (highlightedNodeId && preservedHighlightGraph) {
                setStatus(
                    `Zoom ${rawZoom.toFixed(2)}\n` +
                    `Static tiles + preserved highlighted overlay`
                );
            } else {
                setStatus(`Zoom ${rawZoom.toFixed(2)}\nStatic tiles only`);
            }
            return;
        }

        const floorZ = Math.floor(rawZoom);
        const available = Object.keys(manifest.zoom_levels)
            .map(Number)
            .filter(Number.isFinite)
            .sort((a, b) => a - b);
        if (available.length === 0) {
            setStatus(`Zoom ${rawZoom.toFixed(2)}\nNo interactive zoom levels available`);
            return;
        }
        const chunkZoom = nearestAvailableZoom(floorZ, available);
        const tilePadding = isMapDragging ? DRAG_TILE_PADDING : 0;
        const tiles = getVisibleTiles(map, chunkZoom, tilePadding);
        const desiredTileKeys = new Set(tiles.map(({tx, ty}) => tileKey(chunkZoom, tx, ty)));

        const zoomChanged = currentInteractiveZoom !== chunkZoom;
        currentInteractiveZoom = chunkZoom;
        currentInteractiveTileKeys = desiredTileKeys;

        if (zoomChanged) {
            clearVisibleInteractiveData();
            currentInteractiveZoom = chunkZoom;
            currentInteractiveTileKeys = desiredTileKeys;
        } else if (!isMapDragging) {
            pruneHiddenTiles(desiredTileKeys);
        }

        setStatus(
            `Zoom ${rawZoom.toFixed(2)}\n` +
            `Chunk zoom: ${chunkZoom}\n` +
            `Visible tiles: ${tiles.length}` +
            (isMapDragging ? "\nLoading during drag..." : "")
        );

        for (const {tx, ty} of tiles) {
            loadNodeTile(chunkZoom, tx, ty);
        }

        if (rawZoom < getLabelMinZoom()) {
            clearVisibleLabels();
        }

        renderHighlightOverlay();
    }

    function findMatchingNode(query) {
        const q = query.trim().toLowerCase();
        if (!q) return null;

        const allEntries = getAllNodeEntries();
        for (const [id, entry] of allEntries.entries()) {
            if (id.toLowerCase() === q) return entry;
        }

        for (const [id, entry] of allEntries.entries()) {
            if (id.toLowerCase().includes(q)) return entry;
        }

        for (const node of searchIndex) {
            if (node.id.toLowerCase() === q) {
                return {
                    latlng: wll(node.x, node.y),
                    data: node,
                };
            }
        }

        for (const node of searchIndex) {
            if (node.id.toLowerCase().includes(q)) {
                return {
                    latlng: wll(node.x, node.y),
                    data: node,
                };
            }
        }

        return null;
    }

    async function focusNodeBySearch(query) {
        let match = findMatchingNode(query);

        if (!match) {
            map.setZoom(Math.max(map.getZoom(), getInteractiveMinZoom()));
            await updateVisibleData();
            match = findMatchingNode(query);
        }

        if (!match) {
            setInfo(`Node not found in loaded chunks: ${query}`);
            return;
        }

        const targetZoom = Math.max(map.getZoom(), getLabelMinZoom());
        map.setView(match.latlng, targetZoom, {animate: true});
        await updateVisibleData();
        match = findMatchingNode(query) || match;

        const token = ++viewUpdateToken;
        await ensureHighlightedNeighborhood(match.data.id, token);
        if (token !== viewUpdateToken) return;
        renderHighlightOverlay();
    }

    async function bootstrap() {
        zoomConfig = await fetchJson("./zoom_config.json");
        manifest = await fetchJson(`${CHUNKS_BASE}/manifest.json`);
        searchIndex = await fetchJson(`${CHUNKS_BASE}/search_index.json`).catch(() => []);
        populateHighlightMenus();
        updateLegendText();
        boundsInfo = manifest.bounds;
        map = buildMap(boundsInfo);

        searchBtn.addEventListener("click", async () => {
            const query = searchInput.value.trim();
            if (!query) return;
            setStatus(`Searching for "${query}"...`);
            await focusNodeBySearch(query);
        });

        highlightClusterBtn.addEventListener("click", () => {
            highlightClusterForCurrentNode();
        });

        highlightCategoryMenuBtn.addEventListener("click", () => {
            highlightCategoryByMenu();
        });

        highlightClusterMenuBtn.addEventListener("click", () => {
            highlightClusterByMenu();
        });

        resetBtn.addEventListener("click", () => {
            resetMapView(map, boundsInfo);
        });

        toggleEdgesBtn.addEventListener("click", () => {
            edgesEnabled = !edgesEnabled;
            toggleEdgesBtn.textContent = edgesEnabled ? "Edges: On" : "Edges: Off";
            updateStaticTileVisibility();
        });

        await updateVisibleData();
    }

    bootstrap().catch(err => {
        console.error(err);
        setStatus(`Error: ${err.message}`);
    });
</script>
</body>
</html>
