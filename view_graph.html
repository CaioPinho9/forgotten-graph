<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chunked Graph Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #container {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      width: 320px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.92);
      color: white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    #panel input {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
    }

    #panel button {
      margin-top: 8px;
      margin-right: 6px;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #status {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    #info {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div><strong>Forgotten Realms Graph</strong></div>
    <div id="status">Loading manifest...</div>

    <input id="search" type="text" placeholder="Search node title..." />
    <div>
      <button id="searchBtn">Find</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="info">Click a node to inspect it.</div>
  </div>

  <div id="container"></div>

  <script type="module">
    import Graph from "https://cdn.jsdelivr.net/npm/graphology@0.25.4/+esm";
    import Sigma from "https://cdn.jsdelivr.net/npm/sigma@3.0.0/+esm";

    const statusEl = document.getElementById("status");
    const infoEl = document.getElementById("info");
    const searchInput = document.getElementById("search");
    const searchBtn = document.getElementById("searchBtn");
    const resetBtn = document.getElementById("resetBtn");

    const graph = new Graph();
    const renderer = new Sigma(graph, document.getElementById("container"), {
      renderLabels: false,
      allowInvalidContainer: true,
      defaultEdgeType: "line",
      labelDensity: 0.03,
      labelGridCellSize: 120,
      labelRenderedSizeThreshold: 10,
      zIndex: true,
    });

    let loadedNodes = 0;
    let loadedEdges = 0;

    function updateStatus(manifest, phase) {
      const nodesPct = manifest.nodes_total
        ? ((loadedNodes / manifest.nodes_total) * 100).toFixed(2)
        : "0.00";

      const edgesPct = manifest.edges_total
        ? ((loadedEdges / manifest.edges_total) * 100).toFixed(2)
        : "0.00";

      statusEl.textContent =
        `${phase}\n` +
        `Nodes: ${loadedNodes}/${manifest.nodes_total} (${nodesPct}%)\n` +
        `Edges: ${loadedEdges}/${manifest.edges_total} (${edgesPct}%)`;
    }

    async function fetchJson(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`Failed to fetch ${path}`);
      return await response.json();
    }

    function yieldToBrowser() {
      return new Promise(resolve => setTimeout(resolve, 0));
    }

    async function loadChunksSequentially(manifest) {
      updateStatus(manifest, "Loading node chunks...");

      for (let i = 0; i < manifest.node_files.length; i++) {
        const file = manifest.node_files[i];
        const nodes = await fetchJson(`./graph_chunks/${file}`);

        for (const node of nodes) {
          if (!graph.hasNode(node.key)) {
            graph.addNode(node.key, {
              label: node.label,
              x: node.x,
              y: node.y,
              size: node.size,
              color: node.color,
              ...node.attributes,
            });
            loadedNodes++;
          }
        }

        updateStatus(manifest, `Loading node chunks... (${i + 1}/${manifest.node_files.length})`);
        renderer.refresh();
        await yieldToBrowser();
      }

      updateStatus(manifest, "Loading edge chunks...");

      for (let i = 0; i < manifest.edge_files.length; i++) {
        const file = manifest.edge_files[i];
        const edges = await fetchJson(`./graph_chunks/${file}`);

        for (const edge of edges) {
          if (!graph.hasNode(edge.source) || !graph.hasNode(edge.target)) continue;
          if (!graph.hasEdge(edge.key)) {
            graph.addEdgeWithKey(edge.key, edge.source, edge.target, {
              color: edge.color,
              size: edge.size,
            });
            loadedEdges++;
          }
        }

        updateStatus(manifest, `Loading edge chunks... (${i + 1}/${manifest.edge_files.length})`);
        renderer.refresh();
        await yieldToBrowser();
      }

      updateStatus(manifest, "Done");
    }

    function clearHighlight() {
      graph.forEachNode((node) => {
        graph.setNodeAttribute(node, "color", "#4f46e5");
      });

      graph.forEachEdge((edge) => {
        graph.setEdgeAttribute(edge, "color", "rgba(120,120,120,0.18)");
        graph.setEdgeAttribute(edge, "size", 0.4);
      });

      infoEl.textContent = "Click a node to inspect it.";
      renderer.refresh();
    }

    function highlightNode(node) {
      const neighbors = new Set(graph.neighbors(node));

      graph.forEachNode((n) => {
        if (n === node) {
          graph.setNodeAttribute(n, "color", "#ef4444");
        } else if (neighbors.has(n)) {
          graph.setNodeAttribute(n, "color", "#10b981");
        } else {
          graph.setNodeAttribute(n, "color", "rgba(120,120,120,0.25)");
        }
      });

      graph.forEachEdge((edge, attrs, source, target) => {
        if (source === node || target === node) {
          graph.setEdgeAttribute(edge, "color", "rgba(255,255,255,0.75)");
          graph.setEdgeAttribute(edge, "size", 1.5);
        } else {
          graph.setEdgeAttribute(edge, "color", "rgba(120,120,120,0.08)");
          graph.setEdgeAttribute(edge, "size", 0.2);
        }
      });

      const degree = graph.getNodeAttribute(node, "degree");
      const inDegree = graph.getNodeAttribute(node, "in_degree");
      const outDegree = graph.getNodeAttribute(node, "out_degree");

      infoEl.textContent =
        `Node: ${node}\n` +
        `Degree: ${degree}\n` +
        `In: ${inDegree}\n` +
        `Out: ${outDegree}\n` +
        `Neighbors: ${neighbors.size}`;

      renderer.refresh();
    }

    function focusNode(node) {
      if (!graph.hasNode(node)) {
        infoEl.textContent = `Node not found: ${node}`;
        return;
      }

      highlightNode(node);

      const x = graph.getNodeAttribute(node, "x");
      const y = graph.getNodeAttribute(node, "y");

      renderer.getCamera().animate(
        { x, y, ratio: 0.08 },
        { duration: 600 }
      );
    }

    renderer.on("clickNode", ({ node }) => {
      highlightNode(node);
    });

    renderer.on("clickStage", () => {
      clearHighlight();
    });

    searchBtn.addEventListener("click", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return;

      let found = null;

      graph.forEachNode((node, attrs) => {
        if (found) return;
        const label = (attrs.label || "").toLowerCase();
        if (label === q) found = node;
      });

      if (!found) {
        graph.forEachNode((node, attrs) => {
          if (found) return;
          const label = (attrs.label || "").toLowerCase();
          if (label.includes(q)) found = node;
        });
      }

      if (found) focusNode(found);
      else infoEl.textContent = `Node not found in loaded graph: ${q}`;
    });

    resetBtn.addEventListener("click", () => {
      clearHighlight();
      renderer.getCamera().animate(
        { x: 0, y: 0, ratio: 1 },
        { duration: 600 }
      );
    });

    const manifest = await fetchJson("./graph_chunks/manifest.json");
    updateStatus(manifest, "Starting...");
    await loadChunksSequentially(manifest);
  </script>
</body>
</html>
